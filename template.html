<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наши в НХЛ — утренняя сводка</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Наши в НХЛ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f6; --ice:#ffffff; --ink:#0f2238; --ink2:#4a5a6d; --line:#d6dee8;
  --red:#c8102e; --red-soft:#fbe3e7; --blue:#1d4ed8; --blue-soft:#e3ebfb; --gold:#b7791f; --gold-soft:#fbf0d9;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1520; --ice:#142030; --ink:#eef3f8; --ink2:#9fb0c3; --line:#243447;
    --red:#ff4d63; --red-soft:#3a1a22; --blue:#7aa2ff; --blue-soft:#1b2a4a; --gold:#e3b04b; --gold-soft:#3a2f16;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1520; --ice:#142030; --ink:#eef3f8; --ink2:#9fb0c3; --line:#243447;
  --red:#ff4d63; --red-soft:#3a1a22; --blue:#7aa2ff; --blue-soft:#1b2a4a; --gold:#e3b04b; --gold-soft:#3a2f16;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 56px}
.wrap.wide{max-width:1040px}
/* сцена: площадка слева, список справа */
.stage-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.stage-grid{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);align-items:start}.stage{position:sticky;top:64px}}
.stage{background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stage .rink-wrap{border-top:none;padding-top:0;margin-top:0}
.goal-list{margin:0;padding:0;list-style:none;background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.goal-list li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.goal-list li:last-child{border-bottom:none}
.goal-list li[aria-selected="true"]{background:var(--red-soft)}
.goal-list li:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.goal-list .num{font-weight:800;font-size:13px;color:var(--ink2);width:20px}
.goal-list .who{font-weight:700;font-size:16px}
.goal-list .meta{grid-column:2;color:var(--ink2);font-size:13px}
.goal-list .res{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.goal-list .res small{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.goal-list li.player{grid-template-columns:1fr auto}
.goal-list li.player .meta{grid-column:1}
.goal-list .cnt{font-weight:800;font-size:15px;padding:3px 10px;border-radius:8px;background:var(--red-soft);color:var(--red);white-space:nowrap}
.goal-list li.sub{grid-template-columns:auto 1fr;padding-left:28px;background:var(--bg);font-size:14px}
.goal-list li.sub .num{width:16px}
.goal-list li.sub[aria-selected="true"]{background:var(--red-soft)}
.goal-list li.sub[hidden]{display:none}
.club{background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.club h3{margin:0;padding:10px 14px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.club h3 span{color:var(--ink2);font-weight:600;font-size:13px}
.club .pr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:15px}
.club .pr:last-child{border-bottom:none}
.club .pos{font-size:11px;font-weight:700;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue)}
.club .pos.v{background:var(--gold-soft);color:var(--gold)}.club .pos.z{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.club .pn{font-weight:600}
.club .pn.scored{color:var(--red)}
.club .last{grid-column:2/-1;font-size:13px;color:var(--ink2)}
.club .last b{color:var(--ink);font-weight:600}
.club .st{grid-column:2/-1;font-size:13px;color:var(--gold)}
.club a.yl{font-size:12px;font-weight:600;text-decoration:none;color:var(--red);white-space:nowrap}
.roster-grid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:720px){.roster-grid{grid-template-columns:1fr 1fr}}
.lg{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:8px;flex:0 0 auto}
.game{grid-template-columns:1fr auto;gap:6px 14px;padding:12px 14px}
.game .teams span{display:flex;align-items:center;gap:10px;font-size:17px}
.game .teams span+span{margin-top:6px}
.game .lg{width:40px;height:40px;margin:0}
.game .score{font-size:26px}
.club h3{padding:12px 14px;font-size:16px}
.club h3 .lg{width:36px;height:36px}
.club h3 .cl{display:flex;align-items:center;gap:10px}
.stage-head{align-items:center}
.stage-head .lg{width:44px;height:44px}
.goal-list li.player{grid-template-columns:auto 1fr auto;align-items:center}
.goal-list li.player .meta{grid-column:2}
.goal-list .who{display:flex;align-items:center;gap:8px}
.goal-list .who .lg{width:36px;height:36px;margin:0}
.m-top{align-items:center}
.m-top .who{display:flex;align-items:center;gap:8px}
.m-top .lg{width:36px;height:36px;margin:0}
@media (max-width:420px){.lg{width:30px;height:30px}.game .lg{width:34px;height:34px}.stage-head .lg{width:38px;height:38px}}
.rink .goal-flash{font:800 13px "Inter Tight",sans-serif;fill:#c8102e;text-anchor:middle;opacity:0}
.rink .skater text{font-family:"Inter Tight",sans-serif}
.stage-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.stage-head .who{font-weight:800;font-size:20px;letter-spacing:-.01em}
.stage-head .club{color:var(--ink2);font-size:14px}

header{padding:22px 0 12px}
header h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
header .sub{margin:6px 0 0;color:var(--ink2);font-size:15px}
.totals{display:flex;gap:18px;margin:16px 0 6px;flex-wrap:wrap}
.totals div{font-size:15px;color:var(--ink2)}
.totals b{display:block;font-size:28px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--ice);color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

section{display:none;padding-top:8px}
section.on{display:block}
h2{font-size:14px;font-weight:600;color:var(--ink2);margin:18px 0 8px}

.moment{background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.moment.lead{border-color:var(--red);border-width:2px}
.m-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.m-top .who{font-weight:800;font-size:19px;letter-spacing:-.01em}
.m-top .club{color:var(--ink2);font-size:14px}
.badge{margin-left:auto;font-weight:800;font-size:15px;padding:3px 10px;border-radius:8px;white-space:nowrap}
.badge.goal{background:var(--red-soft);color:var(--red)}
.badge.assist{background:var(--blue-soft);color:var(--blue)}
.badge.save{background:var(--gold-soft);color:var(--gold)}
.m-what{margin:6px 0 0;font-size:15px}
.m-score{margin:6px 0 0;color:var(--ink2);font-size:14px}
.m-score b{color:var(--ink)}
.links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.links a{text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
.links a.yt{border-color:var(--red);color:var(--red)}
.links a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.tbl{width:100%;border-collapse:collapse;background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:15px}
.scroll{overflow-x:auto;border-radius:var(--radius)}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:13px;font-weight:600;color:var(--ink2)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.n{font-weight:600}
.tbl td.c{color:var(--ink2)}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.pts td.n{color:var(--red)}
.tbl th.r{text-align:right}

.game{background:var(--ice);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.game .teams{font-weight:600}
.game .teams span{display:block}
.game .score{font-weight:800;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.game .score small{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
.game .ru{grid-column:1/-1;color:var(--ink2);font-size:14px}
.game .ru b{color:var(--ink);font-weight:600}
.game .time{font-weight:800;font-size:20px;text-align:right}
.note{color:var(--ink2);font-size:14px;margin:10px 0}

/* схема гола */
.rink-wrap{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.rink-cap{font-size:14px;color:var(--ink2);margin:0 0 6px}
.rink-cap b{color:var(--ink);font-weight:600}
.rink{display:block;width:100%;height:auto;border-radius:10px;cursor:pointer}
.rink .ice{fill:#f6f9fc;stroke:#b9c7d6;stroke-width:1.5}
.rink .ln{stroke:#c53a4a;stroke-width:1.2;fill:none}
.rink .bl{stroke:#2b5fd3;stroke-width:1.6;fill:none}
.rink .cr{stroke:#c53a4a;stroke-width:1;fill:none;opacity:.6}
.rink .net{fill:#d6e0ec;stroke:#8a9bb0;stroke-width:1}
.rink .pl{stroke:#fff;stroke-width:1.5}
.rink .pl.s{fill:#c8102e}.rink .pl.a{fill:#1d4ed8}.rink .pl.g{fill:#6b7a8c}
.rink .nm{font:700 7px "Inter Tight",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.rink .lbl{font:600 7px "Inter Tight",sans-serif;fill:#0f2238;text-anchor:middle}
.rink .trace{stroke:#0f2238;stroke-width:1.2;fill:none;stroke-dasharray:3 3;opacity:.45}
.rink .puck{fill:#0f2238}
.rink-hint{font-size:12px;color:var(--ink2);margin:4px 0 0}
@media (prefers-reduced-motion:reduce){.rink animateMotion{display:none}}
footer{margin-top:28px;color:var(--ink2);font-size:13px;line-height:1.5}
footer a{color:var(--ink2)}
@media (max-width:420px){header h1{font-size:26px}.totals{gap:14px}.totals b{font-size:24px}}

/* ---- список игроков за ночь ---- */
.plist{margin:0;padding:0;list-style:none;background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.plist li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.plist li:last-child{border-bottom:none}
.plist li:hover{background:var(--bg)}
.plist .nm{font-weight:700;font-size:16px}
.plist .nm.pts{color:var(--red)}
.plist .sub{grid-column:2;color:var(--ink2);font-size:13px}
.plist .st{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.plist .st small{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.plist .lg{width:36px;height:36px;margin:0}
.club .pr{cursor:pointer}.club .pr:hover{background:var(--bg)}
/* ---- карточка игрока ---- */
.ov{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.ov.on{display:flex}
.card{background:var(--ice);color:var(--ink);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(0,0,0,.3)}
@media (min-width:860px){.ov{align-items:center}.card{border-radius:18px;max-height:90vh}}
.card .hd{display:flex;align-items:center;gap:12px}
.card .hd .lg{width:52px;height:52px;margin:0}
.card .hd h2{margin:0;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.card .hd .meta{color:var(--ink2);font-size:14px;margin-top:2px}
.card .x{margin-left:auto;border:none;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:14px 0}
.stats div{background:var(--bg);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:4px 0 10px}
.seg button{border:none;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.heat{display:block;width:100%;height:auto;border-radius:10px}
.heat .ice{fill:#f6f9fc;stroke:#b9c7d6;stroke-width:1.5}
.heat .ln{stroke:#c53a4a;stroke-width:1.2;fill:none}.heat .bl{stroke:#2b5fd3;stroke-width:1.6;fill:none}
.heat .cr{stroke:#c53a4a;stroke-width:1;fill:none;opacity:.6}.heat .net{fill:#d6e0ec;stroke:#8a9bb0}
.heat .lbl{font:600 7px "Inter Tight",sans-serif;fill:#4a5a6d;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin:8px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.kino-bar{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.kino-bar .pp{width:44px;height:44px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.kino-bar .clk{font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.kino-bar .clk small{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
.kino-bar .sc{margin-left:auto;font-weight:800;font-size:22px;color:var(--red);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--line);position:relative;margin-top:8px}
.prog .fill{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:var(--ink);width:0;transition:width .3s}
.prog .tick{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink2)}
.prog-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:3px}
.heat .ev{opacity:0;transition:opacity .25s}.heat .ev.on{opacity:1}
.heat .nm{font:700 7px "Inter Tight",sans-serif;fill:#0f2238;text-anchor:middle;paint-order:stroke;stroke:#ffffff;stroke-width:2.5px}
.heat .nm.red{fill:#c8102e}.heat .nm.yel{fill:#8a6400}
.heat .arr{stroke:#8a6400;stroke-width:1.3;stroke-dasharray:3 2;fill:none}
.evs{margin:12px 0 0;padding:0;list-style:none;font-size:14px}
.evs li.future{color:var(--ink2);opacity:.55}.evs li.now{background:var(--red-soft)}
.evs li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.evs li .tm{color:var(--ink2);font-variant-numeric:tabular-nums}
.evs li.goal .what{color:var(--red);font-weight:700}
.empty{color:var(--ink2);font-size:14px;padding:12px 0}
</style>
</head>
<body>
<div class="wrap wide">
<header>
  <h1>Наши в НХЛ</h1>
  <p class="sub" id="sub"></p>
  <div class="totals" id="totals"></div>
</header>

<nav role="tablist" id="tabs">
  <button role="tab" aria-selected="true" data-t="night">Ночью</button>
  <button role="tab" aria-selected="false" data-t="roster">Все наши</button>
  <button role="tab" aria-selected="false" data-t="games">Все матчи</button>
  <button role="tab" aria-selected="false" data-t="tonight">Сегодня ночью</button>
</nav>

<section id="night" class="on"></section>
<section id="roster"></section>
<section id="games"></section>
<section id="tonight"></section>

<footer id="foot"></footer>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>
/*__DATA__*/

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const LOGO = DATA.logos || {};
const lg = club => LOGO[club] ? `<img class="lg" src="${esc(LOGO[club])}" alt="" loading="lazy">` : '';
const P = DATA.players || {};
const EVN = DATA.ev_names || {};
const posName = {в:'вратарь', з:'защитник', н:'нападающий'};
const nightLine = {};   // pid -> строка за ночь
const seasonLine = {};  // pid -> строка за сезон

document.getElementById('sub').textContent = DATA.night + " · обновлено " + DATA.updated;
document.getElementById('totals').innerHTML = (DATA.totals||[]).map(([n,l]) => `<div><b>${esc(n)}</b>${esc(l)}</div>`).join('');

// ---------- Ночью ----------
const sk = (DATA.skaters||[]).slice();
const gk = (DATA.goalies||[]).slice();
sk.forEach(([n,c,p,sh,t,pid]) => nightLine[pid] = `${p}, броски ${sh}, ${t}`);
gk.forEach(([n,c,sv,pct,pid]) => nightLine[pid] = `отразил ${sv} (${pct})`);
const row = (pid, name, club, big, small, sub, hot) => `<li data-pid="${pid}">${lg(club)}<span class="nm ${hot?'pts':''}">${esc(name)}</span>
  <span class="st">${esc(big)}<small>${esc(small)}</small></span><span class="sub">${esc(sub)}</span></li>`;
document.getElementById('night').innerHTML = sk.length || gk.length ? `
  <h2>Полевые игроки — ${sk.length}</h2>
  <ul class="plist">${sk.map(([n,c,p,sh,t,pid]) => row(pid, n, c, p, 'г+п', `${c} · броски ${sh} · ${t}`, p!=='0+0')).join('')}</ul>
  <h2>Вратари — ${gk.length}</h2>
  <ul class="plist">${gk.map(([n,c,sv,pct,pid]) => row(pid, n, c, pct, sv, c, sv.split(' ')[0]===sv.split(' ')[2])).join('')}</ul>
  <p class="note">Нажмите на игрока — откроется карточка с тепловой картой и всеми действиями за ночь.</p>`
  : `<p class="empty">Этой ночью россияне не играли.</p>`;

// ---------- Все наши ----------
const total = (DATA.roster||[]).reduce((a,[,ps]) => a+ps.length, 0);
document.getElementById('roster').innerHTML = `
  <p class="note">${total} россиян в ${(DATA.roster||[]).length} клубах. Красным — кто набрал очки этой ночью. Нажмите на игрока — карточка.</p>
  <div class="roster-grid">${(DATA.roster||[]).map(([club, ps]) => `
  <div class="club"><h3><span class="cl">${lg(club)}${esc(club)}</span><span>${ps.length}</span></h3>
    ${ps.map(([n,pos,st,season,pid,num]) => { seasonLine[pid] = season; const nl = nightLine[pid]; return `
    <div class="pr" data-pid="${pid}">
      <span class="pos ${pos==='в'?'v':pos==='з'?'z':''}" title="${posName[pos]}">${pos.toUpperCase()}</span>
      <span class="pn ${nl && !nl.startsWith('0+0') && !nl.startsWith('отразил') ? 'scored':''}">${esc(n)}${num?` <span style="color:var(--ink2);font-weight:500">#${esc(num)}</span>`:''}</span>
      <a class="yl" href="${yt(n+' НХЛ голы моменты')}" target="_blank" rel="noopener">видео</a>
      ${nl ? `<span class="last">Ночью: <b>${esc(nl)}</b></span>` : ''}
      ${season ? `<span class="last">Сезон: <b>${esc(season)}</b></span>` : ''}
      ${st ? `<span class="st">${esc(st)}</span>` : ''}
    </div>`; }).join('')}
  </div>`).join('')}</div>`;

// ---------- Матчи ----------
document.getElementById('games').innerHTML = (DATA.games||[]).map(([h,a,hs,as,x,ru]) => `
  <div class="game">
    <div class="teams"><span>${lg(h)}${esc(h)}</span><span>${lg(a)}${esc(a)}</span></div>
    <div class="score">${hs}:${as}${x?`<small>${esc(x)}</small>`:''}</div>
    <div class="ru"><b>Наши:</b> ${esc(ru)}</div>
  </div>`).join('') || `<p class="empty">Матчей не было.</p>`;
document.getElementById('tonight').innerHTML = `<p class="note">Время екатеринбургское.</p>` + ((DATA.tonight||[]).map(([h,a,t,ru]) => `
  <div class="game">
    <div class="teams"><span>${lg(h)}${esc(h)}</span><span>${lg(a)}${esc(a)}</span></div>
    <div class="time">${esc(t)}</div>
    <div class="ru">${esc(ru)}</div>
  </div>`).join('') || `<p class="empty">Сегодня матчей нет.</p>`);
document.getElementById('foot').innerHTML = `Данные — ${esc((DATA.source||{}).title||'')}. Координаты действий — из протоколов лиги; трекинга движения в открытых данных нет, карта строится по броскам, хитам, блокам, вбрасываниям, потерям и отборам.`;

// ---------- тепловая карта ----------
const KIND = {
  goal:['#c8102e','гол'], 'shot-on-goal':['#e8552f','бросок в створ'], 'missed-shot':['#f0a24a','бросок мимо'], 'shot-blocked':['#f0a24a','бросок заблокирован'],
  assist:['#8a3fd1','передача'], hit:['#1d4ed8','хит'], 'hit-taken':['#7aa2ff','принял хит'], blocked:['#0f8f6a','блок'],
  'fo-win':['#6b7a8c','вбрасывание +'], 'fo-loss':['#b0bac6','вбрасывание −'], giveaway:['#9c6b00','потеря'], takeaway:['#2a9d3a','отбор'],
  penalty:['#000','удаление'], 'faced-save':['#6b7a8c','сейв'], 'faced-goal':['#c8102e','пропущен гол']
};
const toPx = ([x,y]) => [Math.max(8, Math.min(392, 200 + x*1.9)), Math.max(8, Math.min(162, 85 - y*1.85))];
function heat(evs, goalie){
  const pts = evs.filter(e => e.xy);
  const hot = pts.filter(e => goalie ? e.t.startsWith('faced') : !e.t.startsWith('faced'));
  const blobs = hot.map(e => { const [px,py] = toPx(e.xy); const w = e.t==='goal'||e.t==='faced-goal' ? 14 : 10; return `<circle cx="${px}" cy="${py}" r="${w}" fill="#c8102e"/>`; }).join('');
  const dots = hot.map(e => { const [px,py] = toPx(e.xy); const k = KIND[e.t]||['#999',e.t]; const r = e.t==='goal'||e.t==='faced-goal' ? 4.2 : 2.8;
    return `<circle cx="${px}" cy="${py}" r="${r}" fill="${k[0]}" stroke="#fff" stroke-width="1"><title>${esc(k[1])}, ${e.p}-й период ${esc(e.m)}</title></circle>`; }).join('');
  const used = {}; hot.forEach(e => used[e.t] = 1);
  return `<svg class="heat" viewBox="0 0 400 170" role="img" aria-label="Карта действий">
    <defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
    <rect class="ice" x="2" y="2" width="396" height="166" rx="28"/>
    <line class="ln" x1="200" y1="2" x2="200" y2="168"/><line class="bl" x1="125" y1="2" x2="125" y2="168"/><line class="bl" x1="275" y1="2" x2="275" y2="168"/>
    <line class="cr" x1="28" y1="2" x2="28" y2="168"/><line class="cr" x1="372" y1="2" x2="372" y2="168"/>
    <circle class="cr" cx="200" cy="85" r="24"/><circle class="cr" cx="330" cy="47" r="22"/><circle class="cr" cx="330" cy="123" r="22"/><circle class="cr" cx="70" cy="47" r="22"/><circle class="cr" cx="70" cy="123" r="22"/>
    <rect class="net" x="372" y="78" width="7" height="14"/><rect class="net" x="21" y="78" width="7" height="14"/>
    <text class="lbl" x="70" y="160">${goalie?'его ворота':'своя зона'}</text><text class="lbl" x="330" y="160">${goalie?'':'атакует →'}</text>
    <g filter="url(#bl)" opacity="${goalie?0.28:0.33}">${blobs}</g>${dots}
  </svg>
  <div class="legend">${Object.keys(KIND).filter(k => used[k]).map(k => `<span><i style="background:${KIND[k][0]}"></i>${KIND[k][1]}</span>`).join('') || '<span>действий с координатами нет</span>'}</div>`;
}
const pstr = p => p<=3 ? p+'-й период' : 'ОТ';
const secs = e => (Math.min(e.p,4)-1)*1200 + (e.m||'0:0').split(':').reduce((a,b)=>a*60+(+b),0);
const RINK = `<rect class="ice" x="2" y="2" width="396" height="166" rx="28"/>
    <line class="ln" x1="200" y1="2" x2="200" y2="168"/><line class="bl" x1="125" y1="2" x2="125" y2="168"/><line class="bl" x1="275" y1="2" x2="275" y2="168"/>
    <line class="cr" x1="28" y1="2" x2="28" y2="168"/><line class="cr" x1="372" y1="2" x2="372" y2="168"/>
    <circle class="cr" cx="200" cy="85" r="24"/><circle class="cr" cx="330" cy="47" r="22"/><circle class="cr" cx="330" cy="123" r="22"/><circle class="cr" cx="70" cy="47" r="22"/><circle class="cr" cx="70" cy="123" r="22"/>
    <rect class="net" x="372" y="78" width="7" height="14"/><rect class="net" x="21" y="78" width="7" height="14"/>`;
// сцена гола: забивший красным, пасующие жёлтым, фамилии, стрелки
function goalScene(e, goalie){
  const [px,py] = toPx(e.xy); const dir = py < 85 ? 1 : -1; const left = goalie ? 1 : -1;  // у вратаря атака идёт слева
  const sc = {x:px, y:py, n:e.by||''};
  const a = (e.as||[]).map((n,i) => ({x: Math.max(40, Math.min(360, px + left*(48 + i*42))), y: Math.max(20, Math.min(150, py + dir*(20 - i*10))), n}));
  const chain = [...a].reverse().concat([sc]);
  const arrows = chain.slice(0,-1).map((p,i) => `<line class="arr" x1="${p.x}" y1="${p.y}" x2="${chain[i+1].x}" y2="${chain[i+1].y}"/>`).join('');
  return arrows + a.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#f5c400" stroke="#fff" stroke-width="1"/><text class="nm yel" x="${p.x}" y="${p.y-7}">${esc(p.n)}</text>`).join('')
    + `<circle cx="${sc.x}" cy="${sc.y}" r="5" fill="#c8102e" stroke="#fff" stroke-width="1.2"/><text class="nm red" x="${sc.x}" y="${sc.y-8}">${esc(sc.n)}${e.sc?` · ${esc(e.sc)}`:''}</text>`;
}
function kino(evs, goalie){
  const list = evs.filter(e => e.xy && (goalie ? e.t.startsWith('faced') : !e.t.startsWith('faced'))).sort((a,b) => secs(a)-secs(b));
  const items = list.map((e,i) => {
    const [px,py] = toPx(e.xy); const k = KIND[e.t]||['#999',e.t];
    const isGoal = e.t==='goal' || e.t==='faced-goal' || e.t==='assist';
    return `<g class="ev" data-i="${i}">${isGoal ? goalScene(e, goalie) : `<circle cx="${px}" cy="${py}" r="2.8" fill="${k[0]}" stroke="#fff" stroke-width="1"><title>${esc(k[1])}, ${pstr(e.p)} ${esc(e.m)}</title></circle>`}</g>`;
  }).join('');
  const used = {}; list.forEach(e => used[e.t] = 1);
  return `<div class="kino-bar"><button class="pp" type="button" aria-label="Пауза" data-k="pp"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/></svg></button>
      <div class="clk"><span data-k="clock">—</span><small>${list.length} действий за матч</small></div><div class="sc" data-k="score"></div></div>
    <svg class="heat" viewBox="0 0 400 170" role="img" aria-label="Карта действий по ходу матча">${RINK}
      <text class="lbl" x="70" y="160">${goalie?'его ворота':'своя зона'}</text><text class="lbl" x="330" y="160">${goalie?'':'атакует →'}</text>${items}</svg>
    <div class="prog"><div class="fill" data-k="fill"></div><div class="tick" style="left:33.3%"></div><div class="tick" style="left:66.6%"></div></div>
    <div class="prog-l"><span>1-й</span><span>2-й</span><span>3-й</span><span></span></div>
    <div class="legend">${Object.keys(KIND).filter(k => used[k] && !['goal','assist','faced-goal'].includes(k)).map(k => `<span><i style="background:${KIND[k][0]}"></i>${KIND[k][1]}</span>`).join('')}<span><i style="background:#c8102e"></i>забил</span><span><i style="background:#f5c400"></i>отдал пас</span></div>
    <p class="rink-hint">Точки бросков и действий — из протокола лиги; где стояли пасующие, лига не фиксирует, их место условно.</p>`;
}
let kinoTimer = null;
function runKino(card, evs, goalie){
  const list = evs.filter(e => e.xy && (goalie ? e.t.startsWith('faced') : !e.t.startsWith('faced'))).sort((a,b) => secs(a)-secs(b));
  const gs = [...card.querySelectorAll('.heat .ev')], rows = [...card.querySelectorAll('.evs li')];
  const clock = card.querySelector('[data-k="clock"]'), score = card.querySelector('[data-k="score"]'), fill = card.querySelector('[data-k="fill"]'), pp = card.querySelector('[data-k="pp"]');
  let i = 0, playing = true;
  const icon = () => pp.innerHTML = playing ? '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/></svg>' : '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1l10 6-10 6z" fill="currentColor"/></svg>';
  const step = () => {
    if(!playing) return;
    if(i >= list.length){ playing = false; icon(); clock.textContent = 'матч окончен'; return; }
    const e = list[i]; gs[i] && gs[i].classList.add('on');
    rows.forEach(r => { r.classList.remove('now'); if(r.dataset.s !== undefined) r.classList.toggle('future', +r.dataset.s > secs(e)); });
    const row = rows.find(r => +r.dataset.s === secs(e) && r.dataset.t === e.t); if(row) row.classList.add('now');
    clock.textContent = `${pstr(e.p)} · ${e.m}`; fill.style.width = Math.min(100, secs(e)/3600*100) + '%';
    if(e.sc) score.textContent = e.sc;
    const isGoal = e.t==='goal' || e.t==='faced-goal' || e.t==='assist';
    i++; kinoTimer = setTimeout(step, isGoal ? 2200 : 650);
  };
  pp.onclick = () => { playing = !playing; icon(); if(playing){ if(i >= list.length){ i = 0; gs.forEach(g => g.classList.remove('on')); score.textContent=''; } step(); } else clearTimeout(kinoTimer); };
  icon(); clearTimeout(kinoTimer); kinoTimer = setTimeout(step, 500);
}
function evList(evs){
  const list = evs.slice().sort((a,b) => a.p-b.p || a.m.localeCompare(b.m));
  if(!list.length) return `<p class="empty">Действий не зафиксировано.</p>`;
  return `<ul class="evs">${list.map(e => `<li class="${e.t}" data-s="${secs(e)}" data-t="${e.t}"><span class="tm">${pstr(e.p)} ${esc(e.m)}</span><span class="what">${esc(EVN[e.t]||e.t)}${e.sc?` — счёт ${esc(e.sc)}`:''}${e.min?` (${e.min} мин)`:''}</span></li>`).join('')}</ul>`;
}
function statsFor(evs, goalie){
  const c = t => evs.filter(e => e.t===t).length;
  if(goalie){ const sv=c('faced-save'), ga=c('faced-goal'); return [[sv+ga,'бросков'],[sv,'сейвов'],[ga,'пропущено'],[sv+ga?((sv/(sv+ga))*100).toFixed(1)+'%':'—','% сейвов']]; }
  return [[c('goal'),'голов'],[c('assist'),'передач'],[c('shot-on-goal')+c('goal'),'бросков в створ'],[c('hit'),'хитов'],[c('blocked'),'блоков'],[c('fo-win')+c('fo-loss')?`${c('fo-win')}/${c('fo-win')+c('fo-loss')}`:'—','вбрасывания']];
}

let SEASON = null, seasonLoading = null;
function loadSeason(){
  if(SEASON) return Promise.resolve(SEASON);
  if(!seasonLoading) seasonLoading = fetch('events.json', {cache:'no-cache'}).then(r => r.json()).then(j => SEASON = j).catch(() => SEASON = {games:{},players:{}});
  return seasonLoading;
}
function openCard(pid, mode){
  const p = P[pid]; if(!p) return;
  mode = mode || ((DATA.events||{})[pid] ? 'night' : 'season');
  const goalie = p.pos==='в';
  const ov = document.getElementById('ov'); const card = document.getElementById('card');
  const render = evs => {
    const st = statsFor(evs, goalie);
    const gamesN = new Set(evs.map(e => e.gid)).size;
    card.innerHTML = `
      <div class="hd">${lg(p.club)}<div><h2>${esc(p.name)}${p.num?` <span style="color:var(--ink2);font-weight:600">#${esc(p.num)}</span>`:''}</h2>
        <div class="meta">${esc(p.club)} · ${posName[p.pos]||''}${seasonLine[pid]?` · сезон: ${esc(seasonLine[pid])}`:''}</div></div>
        <button class="x" aria-label="Закрыть">×</button></div>
      <div class="seg"><button aria-pressed="${mode==='night'}" data-m="night">Эта ночь</button><button aria-pressed="${mode==='season'}" data-m="season">Сезон${gamesN&&mode==='season'?` · ${gamesN} м.`:''}</button></div>
      ${nightLine[pid] && mode==='night' ? `<p class="note" style="margin:0 0 8px">Ночью: <b style="color:var(--ink)">${esc(nightLine[pid])}</b></p>` : ''}
      <div class="stats">${st.map(([n,l]) => `<div><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join('')}</div>
      ${mode==='night' ? kino(evs, goalie) : heat(evs, goalie)}
      ${mode==='night' ? `<h2>Действия за ночь</h2>${evList(evs)}` : `<p class="note">Карта накапливается с каждым матчем сезона.</p>`}`;
    card.querySelector('.x').onclick = closeCard;
    if(mode==='night' && card.querySelector('[data-k="pp"]')) runKino(card, evs, goalie);
    card.querySelectorAll('.seg button').forEach(b => b.onclick = () => openCard(pid, b.dataset.m));
  };
  ov.classList.add('on'); document.body.style.overflow = 'hidden';
  if(mode==='night'){ render((DATA.events||{})[pid] || []); }
  else { card.innerHTML = `<p class="empty">Загружаю сезон…</p>`; loadSeason().then(j => render((j.players||{})[pid] || [])); }
}
function closeCard(){ clearTimeout(kinoTimer); document.getElementById('ov').classList.remove('on'); document.body.style.overflow = ''; }
document.getElementById('ov').addEventListener('click', e => { if(e.target.id==='ov') closeCard(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeCard(); });
document.addEventListener('click', e => { const el = e.target.closest('[data-pid]'); if(el && !e.target.closest('a')) openCard(el.dataset.pid); });

// вкладки
const tabs = document.getElementById('tabs');
tabs.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id===b.dataset.t));
  try{ localStorage.setItem('nhl-tab', b.dataset.t); }catch(_){}
});
try{ const t = localStorage.getItem('nhl-tab'); if(t){ const b = tabs.querySelector(`[data-t="${t}"]`); if(b) b.click(); } }catch(_){}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
